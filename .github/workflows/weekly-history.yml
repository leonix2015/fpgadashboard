name: Weekly campaign history

on:
  workflow_dispatch:
  schedule:
    # 14:15 UTC is after the dashboard's 07:46 Toronto daily refresh year-round.
    - cron: "15 14 * * 1"

permissions:
  contents: write

concurrency:
  group: weekly-campaign-history
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Update weekly history
        run: node scripts/update-history.mjs

      - name: Commit snapshot when changed
        run: |
          if git diff --quiet -- history.json; then
            echo "Weekly snapshot is already current."
            exit 0
          fi
          git config user.name "FPGA Campaign Bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          git commit -m "Update weekly campaign history"
          git push
